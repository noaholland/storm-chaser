[project]
name = "stormchaser"
version = "0.1.0"
description = "Storm Chaser: market storm score, exposure and cyclone simulator (DurHack 2026)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "pandas>=2.1",
    "websockets>=12",
    "httpx>=0.27",
    "yfinance>=0.2.40",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stormchaser", "stormchaser.adapters"]

[tool.setuptools.package-data]
stormchaser = ["data/*.csv", "data/*.parquet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
